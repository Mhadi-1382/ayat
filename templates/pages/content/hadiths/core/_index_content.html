{% load static %}
<style>
    .surahs-list .surahs-list-card:last-child {border: none !important;}
    .surahs-list-card:target {
        scroll-margin-top: 150px;
        animation: animate-anchor-link 3s ease;
    }

    @keyframes animate-anchor-link {
        100% {
            color: #1d9d9e;
            transition: color 0.4s ease;
        }
        0% {
            color: inherit;
            transition: color 0.4s ease;    
        }
        
    }
</style>

<div class="content-nav-minimize flex flex-col gap-2.5 pt-4 w-full min-[965px]:w-[calc(93%-230px)] min-[1300px]:w-[calc(100%-230px)] mt-22.5 max-[965px]:mt-18.75 rounded-[36px] transition-all">
    <!-- Slider: Categories Content -->
    <div class="slider-categories-content flex items-center gap-2.5 overflow-hidden overflow-x-auto w-full sticky top-20 p-2.5 pb-0 rounded-full backdrop-blur-xs bg-white">
        {% for item in categories_content %}
            <a href="#category-{{ item.id }}" draggable="false">
                <div class="flex items-center text-center text-sm text-slate-500 border border-slate-100 rounded-full whitespace-nowrap py-1 px-2.5 mb-2.5 cursor-pointer">{{ item.title }}</div>
            </a>
        {% endfor %}
    </div>
    
    <!-- Hadiths List -->
    <div class="surahs-list flex flex-col gap-2 mt-4 mb-4">
        {% for item in hadiths %}
            <div class="surahs-list-card flex flex-col gap-0.5 w-full p-4 border-b border-slate-100 text-slate-700" id="category-{{ item.category_content_id.id }}">
                <p class="text-sm mt-2.5 text-slate-600 font-semibold mb-2.5">{{ item.category_content_id.title }}</p>
                <div class="flex flex-col gap-2.5" id="hadith-{{ item.id }}">
                    <p class="font-nabi">{{ item.text_ar | safe }}</p>
                    <p class="text-sm">{{ item.text_fa | safe }}</p>
                </div>
                <p class="text-sm text-gray-400 mt-2.5">{{ item.source }}</p>
                <div class="flex items-center justify-between gap-2.5">
                    <span></span>
                    <div class="flex items-center justify-between gap-2">
                        <a href="javascript:dataShare('{{ item.text_ar | safe }}', '{{ item.text_fa | safe }}', '#hadith-{{ item.id }}');" class="text-gray-500" draggable="false" title="اشتراک گذاری">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-10 p-2.5 hover:bg-gray-50 rounded-full overflow-visible transition-all">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z" />
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
