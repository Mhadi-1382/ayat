{% load static %}
<div class="overlay-modal bg-black/60 fixed inset-0 w-full h-full hidden z-50 transition-all" id="modalCulturalEventsCreate">
    <i class="fixed inset-0 w-full h-full cursor-pointer" onclick="modal('modalCulturalEventsCreate');"></i>
    <div class="modal fixed max-[965px]:left-0 max-[965px]:right-0 max-[965px]:bottom-3 min-[965px]:inset-0 w-full max-[965px]:w-[95%] min-[965px]:w-120 h-fit max-h-[90%] m-auto px-5 pb-5 pt-3 flex flex-col gap-2.5 bg-white rounded-[26px] z-50 overflow-y-auto transition-all">
        <div class="flex flex-col items-center mx-auto text-center">
            <div class="bg-gray-200 w-12 h-1 rounded-full flex items-center justify-center mx-auto mb-1.5"></div>
            <p class="">ایجاد رویداد فرهنگی</p>
        </div>
        <div class="flex flex-col gap-4 text-slate-800 text-sm transition-all">
            <form action="{% url 'panel_cultural_event_create' %}" method="post" class="w-full flex flex-col transition-all">
                {% csrf_token %}

                <input type="text" placeholder="عنوان" name="title" maxlength="500" class="w-full bg-gray-100 py-3 px-6 rounded-t-[20px] outline-none border-none" required>
                <input type="text" placeholder="زمان برگزاری (مثال: 0000-00-00 14:30)" value="{{ time }}" dir="auto" name="event_date" maxlength="50" class="w-full bg-gray-100 py-3 px-6 outline-none border-none" required>
                <textarea rows="6" name="description" placeholder="توضیحات" class="w-full bg-gray-100 py-3 px-6 rounded-b-[20px] outline-none border-none" required></textarea>
                <input type="submit" value="ایجاد" class="w-full bg-primary text-white text-center py-3 px-6 rounded-[20px] outline-none border-none cursor-pointer mt-3">
            </form>
        </div>
    </div>
</div>
