{% load static %}
<style>
    .fr-box.fr-basic .fr-wrapper, .fr-toolbar, .fr-second-toolbar {border: none !important;}
    .fr-toolbar {border-top-left-radius: 20px !important; border-top-right-radius: 20px !important;}
    .fr-second-toolbar {border-bottom-left-radius: 20px !important; border-bottom-right-radius: 20px !important;}
</style>
<div class="panel content-nav-minimize flex flex-col gap-2.5 overflow-auto pt-4 w-full min-[965px]:w-[calc(93%-230px)] min-[1300px]:w-[calc(100%-230px)] mt-22.5 max-[965px]:mt-18.75 rounded-[36px] transition-all">
    {% if request.user.role == 'admin' %}
        <!-- Panel Details -->
        <div class="flex flex-col gap-4">
            <!-- Panel Details: Manage Content -->
            <!-- Panel Details: Manage Content: Duas -->
            <details open class="bg-emerald-50 rounded-4xl p-5 flex flex-col overflow-auto transition-all">
                <summary class="list-none outline-none flex items-center justify-between gap-2.5 text-slate-700 sticky right-0 cursor-pointer">
                    <span class="flex items-center gap-2.5">
                        <span class="bg-orange-200 rounded-full size-2.5" style="content: '';"></span>
                        <span class="font-bold text-sm">ویرایش دعا ({{ dua.title }})</span>
                    </span>
                    <span class="text-gray-600 flex items-center justify-center size-8 pt-1">—</span>
                </summary>

                <div class="mt-4 mb-5"></div>
                <div class="w-full text-slate-600 text-sm flex flex-col gap-2.5">
                    <div class="flex items-center justify-between gap-2.5 px-3 bg-white rounded-full sticky top-0">
                        <p class="py-2.5 font-semibold">شناسه</p>
                        <p class="py-2.5 font-semibold">نام دعا</p>
                        <p class="py-2.5 font-semibold pr-2.5">عملیات</p>
                    </div>

                    <details open class="flex flex-col gap-2.5">
                        <summary class="flex items-center justify-between gap-2.5 outline-none">
                            <p class="w-full py-0.5 cursor-pointer">{{ dua.id }}</p>
                            <p class="w-full py-0.5 cursor-pointer">{{ dua.title }}</p>
                            <div class="flex items-center gap-2.5">
                                <form action="{% url 'panel_dua_delete' id=dua.id %}" method="post">
                                    {% csrf_token %}

                                    <p class="py-0.5"><button type="submit" class="bg-white text-red-600 rounded-full flex items-center justify-center size-8 pt-1 cursor-pointer" title="حذف دعا">×</button></p>
                                </form>
                            </div>
                        </summary>
                        
                        <form action="{% url 'panel_dua_edit' id=dua.id %}" method="post">
                            {% csrf_token %}
                            
                            <textarea id="editor{{ dua.id }}" rows="6" placeholder="متن کامل" name="text_full" class="w-full bg-white py-3 px-6 rounded-[20px] outline-none border-none">{{ dua.text_full }}</textarea>
                            <input type="text" placeholder="عنوان" name="title" value="{{ dua.title }}" maxlength="200" class="w-full bg-white py-3 px-6 rounded-t-[20px] outline-none border-none mt-4" required>
                            <input type="text" placeholder="نام خواننده" name="reciter_name" value="{{ dua.reciter_name }}" maxlength="200" class="w-full bg-white py-3 px-6 outline-none border-none">
                            <input type="url" placeholder="آدرس فایل صدا" name="audio_url" value="{{ dua.audio_url }}" class="w-full bg-white py-3 px-6 outline-none border-none">
                            <select name="category_content_id" class="w-full bg-white py-2 px-6 rounded-b-[20px] outline-none border-none text-slate-500">
                                <option value="">دسته بندی محتوا...</option>
                                {% for category in categories_content %}
                                    <option value="{{ category.id }}" {% if dua.category_content_id.id == category.id %}selected{% endif %}>{{ category.title }}</option>
                                {% endfor %}
                            </select>
                            <input type="submit" value="ثبت" class="w-full bg-primary text-white text-center py-3 px-6 rounded-[20px] outline-none border-none cursor-pointer mt-3">
                        </form>
                    </details>
                </div>
            </details>
        </div>
    {% endif %}

    <div class="pb-4"></div>
</div>
