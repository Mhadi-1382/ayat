{% load static %}
<div class="overlay-modal bg-black/60 fixed inset-0 w-full h-full hidden z-50 transition-all" id="modalPanelQuranAyahInfo{{ j.ayah_number }}">
    <i class="fixed inset-0 w-full h-full cursor-pointer" onclick="modal('modalPanelQuranAyahInfo{{ j.ayah_number }}');"></i>
    <div class="modal fixed max-[965px]:left-0 max-[965px]:right-0 max-[965px]:bottom-3 min-[965px]:inset-0 w-full max-[965px]:w-[95%] min-[965px]:w-120 h-fit max-h-[90%] m-auto px-5 pb-5 pt-3 flex flex-col gap-2.5 bg-white rounded-[26px] z-50 overflow-y-auto transition-all">
        <div class="flex flex-col items-center mx-auto text-center">
            <div class="bg-gray-200 w-12 h-1 rounded-full flex items-center justify-center mx-auto mb-1.5"></div>
            <p class="">ویرایش آیه شماره: {{ j.ayah_number }}</p>
        </div>
        <div class="flex flex-col gap-4 text-slate-800 text-sm transition-all">
            <form action="{% url 'panel_ayah_edit' surah_id=j.surah_id.id id=j.ayah_number %}" method="post">
                {% csrf_token %}
                
                <input type="text" placeholder="شماره آیه" name="ayah_number" value="{{ j.ayah_number }}" class="w-full bg-gray-100 py-3 px-6 rounded-t-[20px] outline-none border-none" required>
                <textarea rows="6" placeholder="متن عربی" name="text_ar" class="w-full bg-gray-100 py-3 px-6 rounded-b-[20px] outline-none border-none" required>{{ j.text_ar }}</textarea>
                <textarea rows="6" placeholder="متن فارسی" name="text_fa" class="w-full bg-gray-100 py-3 px-6 rounded-[20px] outline-none border-none" required>{{ j.text_fa }}</textarea>
                <select name="category_content_id" class="w-full bg-gray-100 py-2 px-6 rounded-[20px] outline-none border-none text-slate-500">
                    <option value="">دسته بندی محتوا...</option>
                    {% for category in categories_content %}
                        <option value="{{ category.id }}" {% if j.category_content_id.id == category.id %}selected{% endif %}>{{ category.title }}</option>
                    {% endfor %}
                </select>
                <input type="submit" value="ثبت" class="w-full bg-primary text-white text-center py-3 px-6 rounded-[20px] outline-none border-none cursor-pointer mt-3">
            </form>
        </div>
    </div>
</div>
