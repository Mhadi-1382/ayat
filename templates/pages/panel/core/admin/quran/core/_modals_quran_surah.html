{% load static %}
<div class="overlay-modal bg-black/60 fixed inset-0 w-full h-full hidden z-50 transition-all" id="modalPanelQuranSurahInfo">
    <i class="fixed inset-0 w-full h-full cursor-pointer" onclick="modal('modalPanelQuranSurahInfo');"></i>
    <div class="modal fixed max-[965px]:left-0 max-[965px]:right-0 max-[965px]:bottom-3 min-[965px]:inset-0 w-full max-[965px]:w-[95%] min-[965px]:w-120 h-fit max-h-[90%] m-auto px-5 pb-5 pt-3 flex flex-col gap-2.5 bg-white rounded-[26px] z-50 overflow-y-auto transition-all">
        <div class="flex flex-col items-center mx-auto text-center">
            <div class="bg-gray-200 w-12 h-1 rounded-full flex items-center justify-center mx-auto mb-1.5"></div>
            <p class="">ویرایش سوره: {{ surah.name_fa }}</p>
        </div>
        <div class="flex flex-col gap-4 text-slate-800 text-sm transition-all">
            <form action="{% url 'panel_surah_edit' id=surah.id %}" method="post">
                {% csrf_token %}
                
                <input type="text" placeholder="نام عربی" name="name_ar" maxlength="100" value="{{ surah.name_ar }}" class="w-full bg-gray-100 py-3 px-6 rounded-t-[20px] outline-none border-none" required>
                <input type="text" placeholder="نام فارسی" name="name_fa" maxlength="100" value="{{ surah.name_fa }}" class="w-full bg-gray-100 py-3 px-6 outline-none border-none" required>
                <input type="tel" placeholder="تعداد آیه" name="total_ayah" value="{{ surah.total_ayah }}" class="w-full bg-gray-100 py-3 px-6 outline-none border-none" required>
                <input type="text" placeholder="نام تلاوت کننده" name="reciter_name" maxlength="200" value="{{ surah.reciter_name }}" class="w-full bg-gray-100 py-3 px-6 outline-none border-none">
                <input type="url" placeholder="آدرس فایل صدا" name="audio_url" value="{{ surah.audio_url }}" class="w-full bg-gray-100 py-3 px-6 rounded-b-[20px] outline-none border-none">
                <input type="submit" value="ثبت" class="w-full bg-primary text-white text-center py-3 px-6 rounded-[20px] outline-none border-none cursor-pointer mt-3">
            </form>
        </div>
    </div>
</div>
