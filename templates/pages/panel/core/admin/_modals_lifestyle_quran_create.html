{% load static %}
<div class="overlay-modal bg-black/60 fixed inset-0 w-full h-full hidden z-50 transition-all" id="modalPanelLifestyleQuranCreate">
    <i class="fixed inset-0 w-full h-full cursor-pointer" onclick="modal('modalPanelLifestyleQuranCreate');"></i>
    <div class="modal fixed max-[965px]:left-0 max-[965px]:right-0 max-[965px]:bottom-3 min-[965px]:inset-0 w-full max-[965px]:w-[95%] min-[965px]:w-120 h-fit max-h-[90%] m-auto px-5 pb-5 pt-3 flex flex-col gap-2.5 bg-white rounded-[26px] z-50 overflow-y-auto transition-all">
        <div class="flex flex-col items-center mx-auto text-center">
            <div class="bg-gray-200 w-12 h-1 rounded-full flex items-center justify-center mx-auto mb-1.5"></div>
            <p class="">افزودن محتوا سبک‌زندگی قرآنی</p>
        </div>
        <div class="flex flex-col gap-4 text-slate-800 text-sm transition-all">
            <form action="{% url 'panel_lifestyle_quran_create' %}" method="post">
                {% csrf_token %}

                <input type="text" placeholder="عنوان" name="title" class="w-full bg-gray-100 py-3 px-6 rounded-[20px] outline-none border-none" required>
                <textarea rows="6" name="arabic" placeholder="متن عربی" class="w-full bg-gray-100 py-3 px-6 rounded-[20px] outline-none border-none mt-2.5" required></textarea>
                <textarea rows="6" name="translation" placeholder="ترجمه" class="w-full bg-gray-100 py-3 px-6 rounded-[20px] outline-none border-none" required></textarea>
                <textarea rows="6" name="analysis" placeholder="تحلیل مفهومی" class="w-full bg-gray-100 py-3 px-6 rounded-[20px] outline-none border-none" required></textarea>
                <textarea rows="6" name="challenge_action" placeholder="چالش عملی" class="w-full bg-gray-100 py-3 px-6 rounded-[20px] outline-none border-none" required></textarea>
                <input type="text" placeholder="منبع" name="source" maxlength="200" class="w-full bg-gray-100 py-3 px-6 rounded-[20px] outline-none border-none" required>
                <input type="submit" value="افزودن" class="w-full bg-primary text-white text-center py-3 px-6 rounded-[20px] outline-none border-none cursor-pointer mt-3">
            </form>
        </div>
    </div>
</div>
