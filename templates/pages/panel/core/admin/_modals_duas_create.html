{% load static %}
<div class="overlay-modal bg-black/60 fixed inset-0 w-full h-full hidden z-50 transition-all" id="modalPanelDuasCreate">
    <i class="fixed inset-0 w-full h-full cursor-pointer" onclick="modal('modalPanelDuasCreate');"></i>
    <div class="modal fixed max-[965px]:left-0 max-[965px]:right-0 max-[965px]:bottom-3 min-[965px]:inset-0 w-full max-[965px]:w-[95%] min-[965px]:w-120 h-fit max-h-[90%] m-auto px-5 pb-5 pt-3 flex flex-col gap-2.5 bg-white rounded-[26px] z-50 overflow-y-auto transition-all">
        <div class="flex flex-col items-center mx-auto text-center">
            <div class="bg-gray-200 w-12 h-1 rounded-full flex items-center justify-center mx-auto mb-1.5"></div>
            <p class="">افزودن دعا</p>
        </div>
        <div class="flex flex-col gap-4 text-slate-800 text-sm transition-all">
            <form action="{% url 'panel_dua_create' %}" method="post">
                {% csrf_token %}
                
                <textarea id="editor_modalPanelDuasCreate" rows="6" placeholder="متن کامل" name="text_full" class="w-full bg-gray-100 py-3 px-6 rounded-[20px] outline-none border-none"></textarea>
                <input type="text" placeholder="عنوان" name="title" maxlength="200" class="w-full bg-gray-100 py-3 px-6 rounded-t-[20px] outline-none border-none mt-4" required>
                <input type="text" placeholder="نام خواننده" name="reciter_name" maxlength="200" class="w-full bg-gray-100 py-3 px-6 outline-none border-none">
                <input type="url" placeholder="آدرس فایل صدا" name="audio_url" class="w-full bg-gray-100 py-3 px-6 rounded-b-[20px] outline-none border-none">
                <input type="submit" value="افزودن" class="w-full bg-primary text-white text-center py-3 px-6 rounded-[20px] outline-none border-none cursor-pointer mt-3">
            </form>
        </div>
    </div>
</div>
