{% extends '../core/_base.html' %}
{% load static %}

{% block title %}مکتب امام‌خامنه‌ای{% endblock title %}
{% block body %}

    <style>
        .maktab-emam-khamenei-audio-display-hide {display: none;}
        .maktab-emam-khamenei-audio-display-show {display: flex;}

        .maktab-emam-khamenei-content {animation: slide-modal-short 0.8s ease;}
        .maktab-emam-khamenei-content .maktab-emam-khamenei-photo-top {animation: slide-modal-short 1.2s ease;}
        .maktab-emam-khamenei-content button {animation: slide-modal-short 1.6s ease;}
        .maktab-emam-khamenei-content .maktab-emam-khamenei-photo-bottom {animation: slide-modal-short 2s ease;}

        .maktab-emam-khamenei-theme-style {background-color: #A20000 !important; transition: all 150ms ease;}
        .maktab-emam-khamenei-theme-style .maktab-emam-khamenei-content button {background-color: #bb0000; transition: all 150ms ease;}
        .maktab-emam-khamenei-theme-style .maktab-emam-khamenei-content button:hover {background-color: #d90000; transition: all 150ms ease;}
    </style>

    <!-- Main -->
    <main class="maktab-emam-khamenei w-full min-[965px]:w-[60%] min-[1300px]:w-[40%]! m-auto p-4 flex flex-col gap-10 overflow-hidden transition-all bg-[#101010]" style="height: 100%;" id="maktabEmamKhamenei">
        <!-- Navbar -->
        <nav class="flex items-center justify-between gap-2.5 w-full bg-transparent! text-white">
            <ul class="flex items-center gap-2.5">
                <span class="size-10 cursor-pointer hover:bg-white/50 rounded-full flex items-center justify-center transition-all" onclick="window.history.back();">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
                    </svg>
                </span>
                <li>مکتب امام‌خامنه‌ای <span class="text-xs text-slate-300">(بزودی)</span></li>
            </ul>
            <ul class="flex items-center gap-2.5">
                <span class="size-10 cursor-pointer hover:bg-white/50 rounded-full flex items-center justify-center transition-all" id="maktabEmamKhameneiThemeRed" onclick="maktabEmamKhameneiTheme('red');">
                    <div class="size-5 rounded-full bg-[#A20000]"></div>
                </span>
                <span class="size-10 cursor-pointer hover:bg-white/50 rounded-full hidden items-center justify-center transition-all" id="maktabEmamKhameneiThemeBlack" onclick="maktabEmamKhameneiTheme('black');">
                    <div class="size-5 rounded-full bg-[#101010]"></div>
                </span>
                <span class="size-10 cursor-pointer hover:bg-white/50 rounded-full flex items-center justify-center transition-all" id="maktabEmamKhameneiAudioPause" onclick="maktabEmamKhameneiAudio('pause');">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75 19.5 12m0 0 2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6 4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/>
                    </svg>
                </span>
                <span class="size-10 cursor-pointer hover:bg-white/50 rounded-full hidden items-center justify-center transition-all" id="maktabEmamKhameneiAudioPlay" onclick="maktabEmamKhameneiAudio('play');">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/>
                    </svg>
                </span>
            </ul>
        </nav>

        <!-- Content -->
        <div class="maktab-emam-khamenei-content flex flex-col items-center justify-center gap-15">
            <audio src="{% static 'assets/audios/maktab-haj-qasem/maktab-haj-qasem.mp3' %}" autoplay controls loop hidden preload="none" class="w-full" id="maktabEmamKhameneiAudioBG"></audio>
            <span class="maktab-emam-khamenei-photo-top flex flex-col items-center justify-center gap-8">
                <img src="{% static 'assets/images/icons/maktab-emam-khamenei.svg' %}" alt="maktab emam khamenei" class="drop-shadow-sm size-40 flex items-center justify-center m-auto transition-all" draggable="false">
                <img src="{% static 'assets/images/maktab-emam-khamenei/title.svg' %}" alt="" class="w-70 flex items-center justify-center m-auto transition-all" draggable="false">
            </span>
            
            <div class="grid grid-cols-2 place-content-between max-[400px]:grid-cols-1 gap-8 w-full transition-all">
                <button class="flex items-center justify-between gap-4 outline-2 outline-white/60 hover:outline-white rounded-2xl pr-6 text-white bg-[#1c1c1c] hover:bg-[#2d2d2d] w-full cursor-pointer transition-all">
                    <span class="text-[18px] font-neirizi max-[500px]:text-base max-[450px]:text-sm transition-all">بیانات منتخب</span>
                    <img src="{% static 'assets/images/icons/maktab-emam-khamenei.svg' %}" alt="" class="drop-shadow-sm size-12 max-[500px]:size-11 relative bottom-4 transition-all" draggable="false">
                </button>
                <button class="flex items-center justify-between gap-4 outline-2 outline-white/60 hover:outline-white rounded-2xl pr-6 text-white bg-[#1c1c1c] hover:bg-[#2d2d2d] w-full cursor-pointer transition-all">
                    <span class="text-[18px] font-neirizi max-[500px]:text-base max-[450px]:text-sm transition-all">صوتهای منتخب</span>
                    <img src="{% static 'assets/images/icons/maktab-emam-khamenei.svg' %}" alt="" class="drop-shadow-sm size-12 max-[500px]:size-11 relative bottom-4 transition-all" draggable="false">
                </button>
                <button class="flex items-center justify-between gap-4 outline-2 outline-white/60 hover:outline-white rounded-2xl pr-6 text-white bg-[#1c1c1c] hover:bg-[#2d2d2d] w-full cursor-pointer transition-all">
                    <span class="text-[18px] font-neirizi max-[500px]:text-base max-[450px]:text-sm transition-all">ویدیوهای منتخب</span>
                    <img src="{% static 'assets/images/icons/maktab-emam-khamenei.svg' %}" alt="" class="drop-shadow-sm size-12 max-[500px]:size-11 relative bottom-4 transition-all" draggable="false">
                </button>
                <button class="flex items-center justify-between gap-4 outline-2 outline-white/60 hover:outline-white rounded-2xl pr-6 text-white bg-[#1c1c1c] hover:bg-[#2d2d2d] w-full cursor-pointer transition-all">
                    <span class="text-[18px] font-neirizi max-[500px]:text-base max-[450px]:text-sm transition-all">گالری</span>
                    <img src="{% static 'assets/images/icons/maktab-emam-khamenei.svg' %}" alt="" class="drop-shadow-sm size-12 max-[500px]:size-11 relative bottom-4 transition-all" draggable="false">
                </button>
            </div>

            <img src="{% static 'assets/images/maktab-emam-khamenei/photo.png' %}" alt="photo" class="maktab-emam-khamenei-photo-bottom w-80 rounded-full transition-all" draggable="false">
        </div>
    </main>

    <!-- Import Script maktab-emam-khamenei.js -->
    <script src="{% static 'js/lib/maktab-emam-khamenei.js' %}"></script>

{% endblock body %}
