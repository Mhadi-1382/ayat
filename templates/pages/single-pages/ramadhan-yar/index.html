{% extends '../core/_base.html' %}
{% load static %}

{% block title %}رمضان‌یار{% endblock title %}
{% block body %}

    <style>
        .ramadhan-yar-audio-display-hide {display: none;}
        .ramadhan-yar-audio-display-show {display: flex;}

        .ramadhan-yar-content {animation: slide-modal-short 0.8s ease;}
        .ramadhan-yar-content .ramadhan-yar-photo-top {animation: slide-modal-short 1.2s ease;}
        .ramadhan-yar-content button,
        .ramadhan-yar-content .card-full {animation: slide-modal-short 1.6s ease;}
        .ramadhan-yar .ramadhan-yar-photo-bottom {animation: slide-modal-short 2s ease, photo-bottom-hue-color 3s linear alternate infinite;}
        @keyframes photo-bottom-hue-color {
            100% {
                filter: brightness(2);
            }
        }
    </style>

    <!-- Main -->
    <main class="ramadhan-yar w-full min-[965px]:w-[60%] min-[1300px]:w-[40%]! m-auto p-4 flex flex-col gap-10 overflow-hidden transition-all bg-[#1b1464]" style="height: 100%;">
        <!-- Navbar -->
        <nav class="flex items-center justify-between gap-2.5 w-full bg-transparent! text-white">
            <ul class="flex items-center gap-2.5">
                <span class="size-10 cursor-pointer hover:bg-white/50 rounded-full flex items-center justify-center transition-all" onclick="window.history.back();">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
                    </svg>
                </span>
                <li>رمضان‌یار <span class="text-xs text-slate-300">(بزودی)</span></li>
            </ul>
            <ul class="flex items-center gap-2.5">
                <span class="size-10 cursor-pointer hover:bg-white/50 rounded-full flex items-center justify-center transition-all" onclick="">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
                    </svg>
                </span>
                <span class="size-10 cursor-pointer hover:bg-white/50 rounded-full flex items-center justify-center transition-all" id="ramadhanYarAudioPause" onclick="ramadhanYarAudio('pause');">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75 19.5 12m0 0 2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6 4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/>
                    </svg>
                </span>
                <span class="size-10 cursor-pointer hover:bg-white/50 rounded-full hidden items-center justify-center transition-all" id="ramadhanYarAudioPlay" onclick="ramadhanYarAudio('play');">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="size-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/>
                    </svg>
                </span>
            </ul>
        </nav>

        <!-- Content -->
        <div class="ramadhan-yar-content flex flex-col items-center justify-center gap-15 z-10">
            <audio src="{% static 'assets/audios/ramadhan-yar/rahman-ya-rahman.mp3' %}" autoplay controls loop hidden preload="none" class="w-full" id="ramadhanYarAudioBG"></audio>
            <span class="maktab-haj-qasem-photo-top flex flex-col items-center justify-center gap-8 ramadhan-yar-photo-top">
                <img src="{% static 'assets/images/ramadhan-yar/ramadhan-yar-logotype.svg' %}" alt="ramadan yar" class="drop-shadow-sm size-40 flex items-center justify-center m-auto transition-all" draggable="false">
                <img src="{% static 'assets/images/ramadhan-yar/title.svg' %}" alt="" class="w-45 flex items-center justify-center m-auto transition-all" draggable="false">
            </span>
            
            <div class="card-full flex flex-col gap-4 outline-1 outline-white/60 rounded-4xl p-5 text-white bg-[#211a74] w-full transition-all">
                <div class="flex items-center gap-2.5">
                    <img src="{% static 'assets/images/ramadhan-yar/ramadhan-yar-logotype.svg' %}" alt="" class="drop-shadow-sm size-6 transition-all" draggable="false">
                    <span class="text-[18px] font-neirizi max-[500px]:text-base max-[450px]:text-sm transition-all">حدیث رمضانی</span>
                </div>
                <div class="flex flex-col gap-2.5">
                    <p class="font-indopak text-2xl leading-10!">رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي</p>
                    <p class="text-sm text-slate-300">پروردگارا سینه‌ام را گشاده کن و کارم را آسان فرما</p>
                </div>
            </div>
            <div class="grid grid-cols-2 place-content-between max-[400px]:grid-cols-1 gap-8 w-full transition-all">
                <button class="flex items-center justify-between gap-4 outline-2 outline-white/60 hover:outline-white rounded-2xl pr-6 text-white bg-[#211a74] hover:bg-[#2f259a] w-full cursor-pointer transition-all">
                    <span class="text-[18px] font-neirizi max-[500px]:text-base max-[450px]:text-sm transition-all">دعای روزانه</span>
                    <img src="{% static 'assets/images/ramadhan-yar/ramadhan-yar-logotype.svg' %}" alt="" class="drop-shadow-sm size-12 max-[500px]:size-11 relative bottom-4 transition-all" draggable="false">
                </button>
                <button class="flex items-center justify-between gap-4 outline-2 outline-white/60 hover:outline-white rounded-2xl pr-6 text-white bg-[#211a74] hover:bg-[#2f259a] w-full cursor-pointer transition-all">
                    <span class="text-[18px] font-neirizi max-[500px]:text-base max-[450px]:text-sm transition-all">لیست ادعیه</span>
                    <img src="{% static 'assets/images/ramadhan-yar/ramadhan-yar-logotype.svg' %}" alt="" class="drop-shadow-sm size-12 max-[500px]:size-11 relative bottom-4 transition-all" draggable="false">
                </button>
                <button class="flex items-center justify-between gap-4 outline-2 outline-white/60 hover:outline-white rounded-2xl pr-6 text-white bg-[#211a74] hover:bg-[#2f259a] w-full cursor-pointer transition-all">
                    <span class="text-[18px] font-neirizi max-[500px]:text-base max-[450px]:text-sm transition-all">اعمال شب قدر</span>
                    <img src="{% static 'assets/images/ramadhan-yar/ramadhan-yar-logotype.svg' %}" alt="" class="drop-shadow-sm size-12 max-[500px]:size-11 relative bottom-4 transition-all" draggable="false">
                </button>
                <button class="flex items-center justify-between gap-4 outline-2 outline-white/60 hover:outline-white rounded-2xl pr-6 text-white bg-[#211a74] hover:bg-[#2f259a] w-full cursor-pointer transition-all">
                    <span class="text-[18px] font-neirizi max-[500px]:text-base max-[450px]:text-sm transition-all">سوره پیشنهادی</span>
                    <img src="{% static 'assets/images/ramadhan-yar/ramadhan-yar-logotype.svg' %}" alt="" class="drop-shadow-sm size-12 max-[500px]:size-11 relative bottom-4 transition-all" draggable="false">
                </button>
                <button class="flex items-center justify-between gap-4 outline-2 outline-white/60 hover:outline-white rounded-2xl pr-6 text-white bg-[#211a74] hover:bg-[#2f259a] w-full cursor-pointer transition-all">
                    <span class="text-[18px] font-neirizi max-[500px]:text-base max-[450px]:text-sm transition-all">احکام رمضانی</span>
                    <img src="{% static 'assets/images/ramadhan-yar/ramadhan-yar-logotype.svg' %}" alt="" class="drop-shadow-sm size-12 max-[500px]:size-11 relative bottom-4 transition-all" draggable="false">
                </button>
                <button class="flex items-center justify-between gap-4 outline-2 outline-white/60 hover:outline-white rounded-2xl pr-6 text-white bg-[#211a74] hover:bg-[#2f259a] w-full cursor-pointer transition-all">
                    <span class="text-[18px] font-neirizi max-[500px]:text-base max-[450px]:text-sm transition-all">زندگی رمضانی</span>
                    <img src="{% static 'assets/images/ramadhan-yar/ramadhan-yar-logotype.svg' %}" alt="" class="drop-shadow-sm size-12 max-[500px]:size-11 relative bottom-4 transition-all" draggable="false">
                </button>
            </div>
        </div>

        <img src="{% static 'assets/images/ramadhan-yar/photo.png' %}" alt="photo" class="ramadhan-yar-photo-bottom mt-12 w-80 rounded-full flex items-center justify-center m-auto transition-all relative z-0" draggable="false">
    </main>

    <!-- Import Script ramadhan-yar.js -->
    <script src="{% static 'js/lib/ramadhan-yar.js' %}"></script>

{% endblock body %}
