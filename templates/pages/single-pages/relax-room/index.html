{% extends '../core/_base.html' %}
{% load static %}

{% block title %}اتاق‌آرامش{% endblock title %}
{% block body %}

    <style>
        .main-relax-room__theme-1 {
            background: linear-gradient(rgba(0, 0, 0, 0.423), rgba(255, 255, 255, 0.035)), url('{% static "assets/images/relax-room/1.jpg" %}') no-repeat center;
            background-size: cover;
            animation: slide-modal-short 0.5s ease, main-relax-room-colored 8s linear alternate infinite;
        }
        .main-relax-room__theme-2 {
            background: linear-gradient(rgba(0, 0, 0, 0.423), rgba(255, 255, 255, 0.035)), url('{% static "assets/images/relax-room/2.jpg" %}') no-repeat center;
            background-size: cover;
            animation: slide-modal-short 0.5s ease, main-relax-room-colored 8s linear alternate infinite;
        }
        .main-relax-room__theme-3 {
            background: linear-gradient(rgba(0, 0, 0, 0.423), rgba(255, 255, 255, 0.035)), url('{% static "assets/images/relax-room/3.jpg" %}') no-repeat center;
            background-size: cover;
            animation: slide-modal-short 0.5s ease, main-relax-room-colored 8s linear alternate infinite;
        }
        .main-relax-room__theme-4 {
            background: linear-gradient(rgba(0, 0, 0, 0.423), rgba(255, 255, 255, 0.035)), url('{% static "assets/images/relax-room/4.jpg" %}') no-repeat center;
            background-size: cover;
            animation: slide-modal-short 0.5s ease, main-relax-room-colored 8s linear alternate infinite;
        }

        .card-relax-room {animation: slide-modal-short 0.6s ease;}

        .badges-relax-room button:focus,
        .badges-relax-room button:active,
        .badge-active {
            outline: 2px solid #1d9d9e;
            outline-offset: 1px;
        }

        @keyframes main-relax-room-colored {
            0% {
                filter: hue-rotate(50deg);
            }
        }
    </style>

    <!-- Main -->
    <main class="relax-room w-full min-[965px]:w-[60%] min-[1300px]:w-[40%]! flex m-auto overflow-hidden relative transition-all" style="height: 100vh;">
        <div class="relative inset-0 bg-primary w-full h-full transition-all" id="mainRelaxRoom"></div>
        <div class="absolute w-full h-full p-4 transition-all">
            <!-- Navbar -->
            <nav class="flex items-center justify-between gap-2.5 w-full text-white bg-transparent!">
                <ul class="flex items-center gap-2.5">
                    <span class="size-10 cursor-pointer hover:bg-white/50 rounded-full flex items-center justify-center transition-all" onclick="window.history.back();">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="size-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
                        </svg>
                    </span>
                    <li>اتاق‌آرامش <span class="text-xs text-slate-700">(ویژه بزودی)</span></li>
                </ul>
                <ul>
                    <span class="size-10 cursor-pointer hover:bg-white/50 rounded-full flex items-center justify-center transition-all" onclick="document.body.requestFullscreen();">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="size-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5h3m-6.75 2.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-15a2.25 2.25 0 0 0-2.25-2.25H6.75A2.25 2.25 0 0 0 4.5 4.5v15a2.25 2.25 0 0 0 2.25 2.25Z"/>
                        </svg>
                    </span>
                </ul>
            </nav>
            
            <div class="h-full flex items-center justify-center m-auto" id="cardRelaxRoom">
                <p class="text-white flex flex-col items-center gap-6">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="size-8 animate-pulse">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.042 21.672 13.684 16.6m0 0-2.51 2.225.569-9.47 5.227 7.917-3.286-.672Zm-7.518-.267A8.25 8.25 0 1 1 20.25 10.5M8.288 14.212A5.25 5.25 0 1 1 17.25 10.5"/>
                    </svg>
                    <span>اتاق‌آرامش خودت رو از پایین انتخاب کن.</span>
                </p>
            </div>
            <div class="badges-relax-room flex items-center gap-2 overflow-hidden overflow-x-auto w-full sticky bottom-2.5 right-4 py-2.5 px-1">
                <button class="flex items-center justify-center gap-1.5 w-auto h-11 px-3 rounded-[36px] backdrop-blur-md bg-white/70 cursor-pointer whitespace-nowrap text-sm transition-all" onclick="mainRelaxRoomToggle('1');"><span>آرامش</span></button>
                <button class="flex items-center justify-center gap-1.5 w-auto h-11 px-3 rounded-[36px] backdrop-blur-md bg-white/70 cursor-pointer whitespace-nowrap text-sm transition-all" onclick="mainRelaxRoomToggle('2');"><span>تمرکز</span></button>
                <button class="flex items-center justify-center gap-1.5 w-auto h-11 px-3 rounded-[36px] backdrop-blur-md bg-white/70 cursor-pointer whitespace-nowrap text-sm transition-all" onclick="mainRelaxRoomToggle('3');"><span>قبل از خواب</span></button>
                <button class="flex items-center justify-center gap-1.5 w-auto h-11 px-3 rounded-[36px] backdrop-blur-md bg-white/70 cursor-pointer whitespace-nowrap text-sm transition-all" onclick="mainRelaxRoomToggle('4');"><span>مناجات</span></button>
            </div>
        </div>
    </main>

    <!-- Import Script relax-room.js -->
    <script src="{% static 'js/lib/relax-room.js' %}"></script>

{% endblock body %}
