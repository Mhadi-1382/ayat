{% load static %}
<style>
    .alert-container-style {display: none; pointer-events: none;}
    .alert-style {transform: translateY(10rem); opacity: 1;}
    #alert {pointer-events: none;}
</style>

{% if messages %}
    <div class="py-2 px-4 flex flex-col items-center justify-center gap-3 m-auto w-full fixed top-5 z-50 transition-all" id="alert">
        {% for msg in messages %}
            {% if msg.tags == 'success' %}
                <div class="alerts flex items-center gap-2.5 py-2.5 px-3 bg-white rounded-2xl drop-shadow-sm -translate-y-40 opacity-0 transition-all" id="alert-{{ msg.tags }}">
                    <svg width="1.5em" height="1.5em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M2.25 12C2.25 6.61522 6.61522 2.25 12 2.25C17.3848 2.25 21.75 6.61522 21.75 12C21.75 17.3848 17.3848 21.75 12 21.75C6.61522 21.75 2.25 17.3848 2.25 12ZM15.6103 10.1859C15.8511 9.84887 15.773 9.38046 15.4359 9.1397C15.0989 8.89894 14.6305 8.97701 14.3897 9.31407L11.1543 13.8436L9.53033 12.2197C9.23744 11.9268 8.76256 11.9268 8.46967 12.2197C8.17678 12.5126 8.17678 12.9874 8.46967 13.2803L10.7197 15.5303C10.8756 15.6862 11.0921 15.7656 11.3119 15.7474C11.5316 15.7293 11.7322 15.6153 11.8603 15.4359L15.6103 10.1859Z" fill="#52c41a"/>
                    </svg>
                    <p class="text-sm max-[965px]:text-xs text-slate-600 transition-all">{{ msg }}</p>
                </div>
            {% elif msg.tags == 'error' %}
                <div class="alerts flex items-center gap-2.5 py-2.5 px-3 bg-white rounded-2xl drop-shadow-sm -translate-y-40 opacity-0 transition-all" id="alert-{{ msg.tags }}">
                    <svg width="1.5em" height="1.5em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.25C6.61522 2.25 2.25 6.61522 2.25 12C2.25 17.3848 6.61522 21.75 12 21.75C17.3848 21.75 21.75 17.3848 21.75 12C21.75 6.61522 17.3848 2.25 12 2.25ZM10.2803 9.21967C9.98744 8.92678 9.51256 8.92678 9.21967 9.21967C8.92678 9.51256 8.92678 9.98744 9.21967 10.2803L10.9393 12L9.21967 13.7197C8.92678 14.0126 8.92678 14.4874 9.21967 14.7803C9.51256 15.0732 9.98744 15.0732 10.2803 14.7803L12 13.0607L13.7197 14.7803C14.0126 15.0732 14.4874 15.0732 14.7803 14.7803C15.0732 14.4874 15.0732 14.0126 14.7803 13.7197L13.0607 12L14.7803 10.2803C15.0732 9.98744 15.0732 9.51256 14.7803 9.21967C14.4874 8.92678 14.0126 8.92678 13.7197 9.21967L12 10.9393L10.2803 9.21967Z" fill="#e7000b"/>
                    </svg>
                    <p class="text-sm max-[965px]:text-xs text-slate-600 transition-all">{{ msg }}</p>
                </div>
            {% elif msg.tags == 'warning' %}
                <div class="alerts flex items-center gap-2.5 py-2.5 px-3 bg-white rounded-2xl drop-shadow-sm -translate-y-40 opacity-0 transition-all" id="alert-{{ msg.tags }}">
                    <svg width="1.5em" height="1.5em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M2.25 12C2.25 6.61522 6.61522 2.25 12 2.25C17.3848 2.25 21.75 6.61522 21.75 12C21.75 17.3848 17.3848 21.75 12 21.75C6.61522 21.75 2.25 17.3848 2.25 12ZM12 8.25C12.4142 8.25 12.75 8.58579 12.75 9V12.75C12.75 13.1642 12.4142 13.5 12 13.5C11.5858 13.5 11.25 13.1642 11.25 12.75V9C11.25 8.58579 11.5858 8.25 12 8.25ZM12 16.5C12.4142 16.5 12.75 16.1642 12.75 15.75C12.75 15.3358 12.4142 15 12 15C11.5858 15 11.25 15.3358 11.25 15.75C11.25 16.1642 11.5858 16.5 12 16.5Z" fill="#ff8904"/>
                    </svg>
                    <p class="text-sm max-[965px]:text-xs text-slate-600 transition-all">{{ msg }}</p>
                </div>
            {% elif msg.tags == 'info' %}
                <script src="{% static 'js/lib/notification-local.js' %}"></script>
                <script>
                    notificationLocal('{{ msg }}', '/');
                </script>
            {% endif %}
        {% endfor %}
    </div>
    
{% endif %}

<script defer src="{% static 'js/lib/alert.js' %}"></script>
